# ═══════════════════════════════════════════
#  Jekyll — GitHub Pages Configuration
# ═══════════════════════════════════════════

title: "Romain Rincé — Consultant & Formateur en IA / Machine Learning"
description: "Docteur en Machine Learning, je fournis conseil, prototypage et formations en Python, Machine Learning et Deep Learning. Basé à Nantes, disponible dans toute la France."
url: "https://nyxaether.github.io"  # GitHub Pages URL (ou romainrince.fr)
baseurl: ""                       # Changer si le site est dans un repo non-user/org

# Build settings — GitHub Pages uses the GitHub-actions builder
markdown: kramdown
permalink: pretty

# Collections — training data loaded via native YAML frontmatter
collections:
  trainings:
    output: false           # no individual pages, just data in site.trainings

# Exclude build/dev artifacts from site output
exclude:
  - .claude
  - node_modules
  - test_parser.js
  - Gemfile
  - Gemfile.lock
  - README.md
  - _data

# Plugins (only those supported by GitHub Pages)
plugins:
  - jekyll-seo-tag

# SEO defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        title: "Romain Rincé"
        description: "Consultant & Formateur en Intelligence Artificielle, Machine Learning et Deep Learning."
        tags:
          category:
            - Machine Learning
            - Deep Learning
            - Python
            - Formation
            - Data Science

# Social / author
social:
  name: Romain Rincé
  links:
    - https://github.com/nyxaether
    - https://www.linkedin.com/in/rrince/
