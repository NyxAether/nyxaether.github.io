<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon/favicon-light.svg' | relative_url }}" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon/favicon-dark.svg' | relative_url }}" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/favicon-180.png' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  <!-- Theme (applied before paint to avoid a flash) -->
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var stored = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', stored === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <!-- SEO -->
  {% seo %}
</head>
<body>

  <!-- ── NAV ── -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}#hero" class="nav-brand">rr<span>/</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="{{ '/' | relative_url }}#expertise" data-section="expertise">expertise</a></li>
        <li><a href="{{ '/' | relative_url }}#formations" data-section="formations">formations</a></li>
        <li><a href="{{ '/' | relative_url }}#services" data-section="services">services</a></li>
        <li><a href="{{ '/' | relative_url }}#avis" data-section="avis">avis</a></li>
        <li><a href="{{ '/' | relative_url }}#contact" data-section="contact">contact</a></li>
      </ul>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" aria-label="Basculer le thème">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/></svg>
        </button>
        <button id="menuToggle" class="menu-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ── PAGE CONTENT ── -->
  {{ content }}

  <!-- ── FOOTER ── -->
  <footer class="footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} — Romain Rincé, consultant &amp; formateur en intelligence artificielle</p>
    </div>
  </footer>

  <!-- ── TRAINING MODAL ── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="trainingModal">
      <button class="modal-close" id="modalClose" aria-label="Fermer">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ── Training Data (server-side JSON from Jekyll collection) ── -->
  <script id="training-data" type="application/json">
[
{%- for t in site.trainings -%}
{
  "id": {{ t.slug | upcase | jsonify }},
  "title": {{ t.title | jsonify }},
  "short": {{ t.short | jsonify }},
  "duration": {{ t.duration | jsonify }},
  "price": {{ t.price | jsonify }},
  "category": {{ t.category | jsonify }},
  "audience": {{ t.audience | jsonify }},
  "prerequisites": {{ t.prerequisites | jsonify }},
  "objectives": {{ t.objectives | jsonify }},
  "program": {{ t.program | jsonify }}
}{%- unless forloop.last -%},{% endunless -%}
{%- endfor -%}
]
  </script>

  <!-- ── Scripts ── -->
  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>

  <!-- ── Analytics (GoatCounter, privé) ── -->
  <script data-goatcounter="https://nyxhemera.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
